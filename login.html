<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Makes webpage responsive on different screeens (control the page's dimensions and scaling) -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Webpage title -->
    <title>Coding Conf 2026 | Registration System</title>
    <!-- Links the external CSS stylesheet -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <!-- Header section containing the Coding Conf logo -->
    <header>
    <nav>
        <a href="index.html">
        <div class="logo">
            <img src="../Assets/logo-full.svg" alt="Coding Conf 2026 Logo">
        </div>  
        </a>
    </nav>
    </header>

    <!--Main registration Form Section-->
    <main>
    <div class="center">
        <h1>Register for Coding Conf 2026&#128187;</h1>
        <h3>Start your journey here!</h3>
    
        <!-- Form Elements -->
        <form id="registerForm" novalidate>
        <!-- Allowing users to upload avatar-->
            <p>
                 Upload avatar:
            </p>

        <div class="dropdown">
            <!-- Label acts as the clickable drop zone -->
            <label for="avatar" id="drop-area">
            <input type="file" accept="image/*" id="avatar">
                <div id="img-view">
                  <img src="../Assets/icon-upload.svg">
                  <p>Drag and drop or click<br> to upload avatar</p>
                </div>
             <!-- Error message container for avatar -->
            <span id="avatar-message" class="error-message"></span>
           </label> 
        </div>

            <!-- Allowing users to enter full name-->
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" placeholder="" required>
            <!-- Error message container for name -->
            <span id="name-message" class="error-message"></span>

            <!-- Allowing users to enter Github username-->
            <label for="username">GitHub Username:</label>
            <input type="text" id="username" name="username" placeholder="@username">
            <!-- Error message container for useraname -->
            <span id="username-message" class="error-message"></span>

            <!-- Allowing users to enter email address-->
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="example@domain.com">
            <!-- Error message container for email -->
            <span id="email-message" class="error-message"></span>
 
             <!-- Submit button that generates tickt-->
            <button type="submit" class="register-btn">Generate Ticket</button>
        </form>
    </div>

    </main>
    
     <!-- Footer section containing copyright information -->
    <footer>
        <p>&copy; 2026 Coding Conf. All Rights Reserved.</p>
    </footer>
     <script src="../js/validation.js"></script>
</body>
</html>
